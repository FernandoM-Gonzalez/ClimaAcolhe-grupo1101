<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ClimaAcolhe - apoio à triagem comunitária em períodos de calor.">
    <title>ClimaAcolhe - Login do Coordenador</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/iptd.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/painel.js"></script>
    <script defer src="js/validation.js"></script>
    <script defer src="js/weather.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body data-page="login">
<header><h1>Login do Coordenador</h1><aside id="weather-widget" class="weather-widget" aria-label="Tempo de hoje"></aside></header>

<noscript><p class="aviso">Ative o JavaScript para utilizar o ClimaAcolhe.</p></noscript>
<main>
    <div id="feedback" class="aviso" hidden tabindex="-1"></div>
    <p>Entre para acessar o cadastro de moradias, os check-ins e o painel da associação.</p>
<form id="login-form" novalidate>
<fieldset><legend>Acesso</legend>
<label for="email">E-mail:</label>
<input type="email" id="email" name="email" placeholder="coordenador@associacao.org" required maxlength="254" autocomplete="username" aria-describedby="erro-email">
<span id="erro-email" class="field-error" data-error-for="email" aria-live="polite"></span>
<label for="senha">Senha:</label>
<input type="password" id="senha" name="senha" required minlength="6" maxlength="128" autocomplete="current-password" aria-describedby="erro-senha"><button type="button" id="toggle-password" aria-pressed="false">Mostrar senha</button>
<span id="erro-senha" class="field-error" data-error-for="senha" aria-live="polite"></span>
</fieldset>
<button type="submit">Entrar</button>
</form>
<div class="aviso demo-account"><strong>Login de teste</strong><p>E-mail: <span id="demo-email"></span><br>Senha: <span id="demo-password"></span></p><button type="button" id="fill-demo">Preencher login de teste</button><p>Autenticação demonstrativa. O servidor em C fará a autenticação definitiva.</p></div>
</main>
<footer><small>ClimaAcolhe - Grupo 1101 - 3ª entrega</small></footer>
</body>
</html>
