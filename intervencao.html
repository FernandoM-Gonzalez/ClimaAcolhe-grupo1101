<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ClimaAcolhe - apoio à triagem comunitária em períodos de calor.">
    <title>ClimaAcolhe - Registro de Intervenção</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/iptd.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/painel.js"></script>
    <script defer src="js/validation.js"></script>
    <script defer src="js/weather.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body data-page="intervencao">
<header><h1>Registro de Intervenção</h1><aside id="weather-widget" class="weather-widget" aria-label="Tempo de hoje"></aside></header>
<nav aria-label="Navegação principal">
    <a href="inicio.html">Início</a>
    <a href="cadastro.html">Moradia</a>
    <a href="checkin.html">Check-in</a>
    <a href="painel.html">Painel</a>
    <a href="intervencao.html">Intervenção</a>
    <button type="button" id="sair">Sair</button>
</nav>
<p class="sessao"><span id="usuario"></span> | <span id="mode-notice"></span></p>
<noscript><p class="aviso">Ative o JavaScript para utilizar o ClimaAcolhe.</p></noscript>
<main hidden>
    <div id="feedback" class="aviso" hidden tabindex="-1"></div>
    <form id="intervencao-form" novalidate><fieldset><legend>Atendimento</legend><label for="codigo">Código da moradia:</label>
<select id="codigo" name="codigo" required aria-describedby="erro-codigo"><option value="">Carregando moradias…</option></select>
<span id="erro-codigo" class="field-error" data-error-for="codigo" aria-live="polite"></span>
<label for="data">Data:</label>
<input type="date" id="data" name="data" required aria-describedby="erro-data">
<span id="erro-data" class="field-error" data-error-for="data" aria-live="polite"></span>
<label for="situacao">Situação:</label>
<select id="situacao" name="situacao" required aria-describedby="erro-situacao"><option value="">Selecione</option><option>Pendente</option><option>Em atendimento</option><option>Concluído</option></select>
<span id="erro-situacao" class="field-error" data-error-for="situacao" aria-live="polite"></span>
<label for="acao">Ação realizada:</label>
<textarea id="acao" name="acao" rows="5" required minlength="10" maxlength="1000" placeholder="Ex.: orientação sobre ventilação e instalação de sombreamento com material doado." aria-describedby="erro-acao acao-count"></textarea><small id="acao-count">0 / 1.000 caracteres</small>
<span id="erro-acao" class="field-error" data-error-for="acao" aria-live="polite"></span>
</fieldset><button type="submit">Registrar intervenção</button></form><section class="caixa"><h2>Histórico de intervenções</h2><p id="history-count"></p><div id="history-list"></div></section><a class="botao" href="painel.html">Voltar ao painel</a>
</main>
<footer><small>ClimaAcolhe - Grupo 1101 - 3ª entrega</small></footer>
</body>
</html>
