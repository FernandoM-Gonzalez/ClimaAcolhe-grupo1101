<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Tela demonstrativa de login do coordenador no ClimaAcolhe.">
    <title>ClimaAcolhe - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Login do Coordenador</h1></header>
<main>
    <p>Esta tela representa o acesso restrito que será usado pela associação.</p>
    <form action="#" method="post">
        <fieldset>
            <legend>Acesso</legend>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="coordenador@associacao.org" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </fieldset>
        <button type="submit">Entrar</button>
    </form>
    <div class="aviso">O login é apenas visual nesta prévia. Autenticação real e controle de sessão serão implementados futuramente.</div>
    <a class="botao" href="index.html">Voltar ao protótipo</a>
</main>
<footer><small>ClimaAcolhe - Protótipo em HTML e CSS</small></footer>
</body>
</html>
